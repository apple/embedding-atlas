[package]
name = "nndescent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust port of PyNNDescent - fast approximate nearest neighbor search"

[features]
default = []
gpu = ["wgpu", "bytemuck"]

[dependencies]
ndarray = { workspace = true, features = ["rayon"] }
rayon = { workspace = true }
ordered-float = "5.2"
getrandom = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

# Portable distance kernels; wasm32 with simd128 uses core::arch::wasm32 instead.
[target.'cfg(not(all(target_arch = "wasm32", target_feature = "simd128")))'.dependencies]
wide = "1.2.0"

[lints]
workspace = true
